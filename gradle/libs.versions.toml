espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.3.0"
composeBom = "2026.03.01"
hilt = "2.59.2"
room_version = "2.8.4"
ksp = "2.3.4"
work = "2.11.2"
core-splash-screen = "1.2.0"
retrofit = "3.0.0"
okHttp = "4.11.0"
serialization = "1.11.0"
